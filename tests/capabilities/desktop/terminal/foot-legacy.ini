# managed by MirrorOS configure
# Palette: Tokyo Night by Folke Lemaitre (MIT); see sources.md and LICENSE.tokyonight.
# https://github.com/folke/tokyonight.nvim/blob/b262293ef481b0d1f7a14c708ea7ca649672e200/extras/kitty/tokyonight_night.conf
[main]
term=foot
font=JetBrainsMono Nerd Font Mono:size=14
pad=16x16 center
initial-window-mode=windowed
workers=0

[bell]
system=no

[colors-dark]
background=1a1b26
foreground=c0caf5
selection-background=283457
selection-foreground=c0caf5
urls=73daca
cursor=1a1b26 c0caf5

regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6

bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
