# managed by MirrorOS configure
# Original minimal MirrorOS layout using the shell's default palette. Solid background only (no screenshot), so no
# window or notification content is rendered on the lock surface. Authentication is hyprlock with the system PAM
# service /etc/pam.d/hyprlock; MirrorOS code never handles credentials.
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgb(16, 19, 21)
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgb(202, 204, 204)
    font_size = 64
    font_family = $font

    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 0

    outer_color = rgb(202, 204, 204)
    inner_color = rgb(16, 19, 21)
    font_color = rgb(202, 204, 204)
    check_color = rgb(202, 204, 204)
    fail_color = rgb(165, 85, 85)

    font_family = $font
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $PAMFAIL
    check_text = Authenticating…

    position = 0, -20
    halign = center
    valign = center
}

# Active keyboard layout (us/es target, DEC-017)
label {
    monitor =
    text = $LAYOUT
    color = rgb(202, 204, 204)
    font_size = 12
    font_family = $font

    position = 0, -80
    halign = center
    valign = center
}
