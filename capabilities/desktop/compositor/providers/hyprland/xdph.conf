# managed by MirrorOS configure
# xdg-desktop-portal-hyprland reads only $XDG_CONFIG_HOME/hypr/xdph.conf or ~/.config/hypr/xdph.conf, so this is a
# user file; a user-owned copy without the marker above is preserved. The share picker's "allow restore token"
# box starts checked, so Chromium's preview session and its share session reuse one choice instead of prompting
# twice. The picker still prompts for every new share. Story 4.5 laboratory amendment of DEC-012; adapted from
# Omarchy config/hypr/xdph.conf without its custom picker.
screencopy {
    allow_token_by_default = true
}
