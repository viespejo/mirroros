# managed by MirrorOS configure
# hypridle owns idle detection and lock requests; hyprlock owns the lock surface and authentication through the
# system PAM service /etc/pam.d/hyprlock. The desktop shell owns neither and is not required for locking.

general {
    # Single locker: logind Lock (loginctl lock-session from the menu, SUPER+Ctrl+L, idle and before sleep) arrives
    # here. lock-screen selects layout index 0, the configured layout, before locking (decision J(a), ADR 0015) and
    # restores the previous layout after unlocking. It runs only when no locker exists, so a repeated Lock request
    # does not change the layout while the user types.
    lock_cmd = pidof hyprlock || /usr/share/mirroros/lock/lock-screen
    before_sleep_cmd = loginctl lock-session
    # Compositor-backed lock state for the shell's while-away count (DEC-021/022): the marker changes, then a running
    # shell is asked to reread it. Without a running shell the request fails harmlessly; the shell reads the marker
    # when it starts. No notification content is involved.
    on_lock_cmd = touch "${XDG_RUNTIME_DIR:?}/mirroros-shell-locked"; qs ipc -p /usr/share/mirroros/shell call notifications lockChanged
    on_unlock_cmd = rm -f "${XDG_RUNTIME_DIR:?}/mirroros-shell-locked"; qs ipc -p /usr/share/mirroros/shell call notifications lockChanged
}

# Lock after 5 minutes idle. No screensaver, DPMS, backlight or suspend step.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
