# managed by MirrorOS configure
# MirrorOS addition to the packaged hypridle.service (DEC-023); everything else stays as packaged. Before hypridle
# starts, remove a lock marker left by a hypridle that stopped while locked and ask a running shell to reread it;
# hypridle reports the lock again when it starts in a locked session. Both commands may fail harmlessly.
[Service]
ExecStartPre=-/usr/bin/rm -f %t/mirroros-shell-locked
ExecStartPre=-/usr/bin/qs ipc -p /usr/share/mirroros/shell call notifications lockChanged
