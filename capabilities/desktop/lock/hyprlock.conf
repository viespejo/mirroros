# managed by MirrorOS configure
# Original minimal MirrorOS lock (ADR 0021): one password field over the selected background, blurred, or the theme
# background color when the image is missing. The background is image data, never a screenshot, so no window or
# notification content is rendered on the lock surface. Authentication is hyprlock with the system PAM service
# /etc/pam.d/hyprlock; MirrorOS code never handles credentials.
$font = JetBrainsMono Nerd Font

# Neutral fallbacks, replaced by the selected theme's variables. A missing theme file is logged and these remain.
# These paths use the default XDG state and cache directories (~/.local/state, ~/.cache).
$background = rgb(16, 19, 21)
$field = rgba(16, 19, 21, 0.8)
$foreground = rgb(202, 204, 204)
$accent = rgb(202, 204, 204)
$failure = rgb(165, 85, 85)
# Field geometry in physical pixels, as hyprlock lays out. These fallbacks match 1920x1080 at scale 1.6; lock-screen
# replaces them with the 378x57 logical field and 3 logical-pixel border at the focused monitor's scale (DEC-012).
$field_size = 31.5%, 8.4%
$field_border = 5
source = ~/.local/state/mirroros/current/theme/hyprlock.conf
source = ~/.cache/mirroros/lock/geometry.conf

general {
    hide_cursor = false
    fail_timeout = 5000
}

animations {
    enabled = false
}

background {
    monitor =
    path = ~/.local/state/mirroros/current/background
    color = $background
    blur_passes = 3
    blur_size = 8
    brightness = 0.9
}

input-field {
    monitor =
    size = $field_size
    outline_thickness = $field_border
    rounding = 0

    outer_color = $accent
    inner_color = $field
    font_color = $foreground
    check_color = $accent
    fail_color = $failure

    font_family = $font
    fade_on_empty = false
    placeholder_text = <span alpha="60%">Enter Password</span>
    fail_text = <i>$PAMFAIL</i>
    check_text = Authenticating…

    position = 0, 0
    halign = center
    valign = center
}
