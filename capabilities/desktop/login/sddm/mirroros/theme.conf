; MirrorOS SDDM theme defaults. keyboardLayout is supplied by configure in theme.conf.user.
[General]
background="#101315"
foreground="#cacccc"
failure="#a55555"
font="JetBrainsMono Nerd Font"
logo=/usr/share/mirroros/branding/mirroros-wordmark.png
session=/usr/share/mirroros/wayland-sessions/hyprland-uwsm.desktop
keyboardLayout=
; Active layout written by the greeter compositor's indicator helper, and its switching keys (ADR 0015).
layoutState=/var/lib/sddm/mirroros-greeter-layout
layoutHint=Super+I
needsFullUserModel=true
