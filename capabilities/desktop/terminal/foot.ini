# managed by MirrorOS configure
# Palette: Osaka Jade adapted from Omarchy (MIT); see sources.md.
[main]
term=foot
font=JetBrainsMono Nerd Font Mono:size=9
pad=14x14 center
initial-window-mode=windowed
workers=0

[bell]
system=no

[colors-dark]
background=111c18
foreground=c1c497
selection-background=32473b
selection-foreground=c1c497
urls=2dd5b7
cursor=111c18 c1c497

regular0=0c1512
regular1=ff5345
regular2=549e6a
regular3=459451
regular4=509475
regular5=d2689c
regular6=2dd5b7
regular7=c1c497

bright0=53685b
bright1=db9f9c
bright2=63b07a
bright3=e5c736
bright4=acd4cf
bright5=75bbb3
bright6=8cd3cb
bright7=f7e8b2

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
