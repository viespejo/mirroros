# Personal Foot configuration.
# MirrorOS defaults and the selected theme are loaded before personal overrides.
# This theme path uses the default XDG state directory (~/.local/state).
# If an include is missing, launch the standalone recovery configuration with:
# foot --config /usr/share/mirroros/foot/recovery.ini
include=/usr/share/mirroros/foot/defaults.ini
include=~/.local/state/mirroros/current/theme/foot.ini

# Add personal overrides below. For example:
# [main]
# font=JetBrainsMono Nerd Font Mono:size=9
# pad=14x14 center
