# managed by MirrorOS configure
# Omarchy 4.0.6 (MIT), config/wireplumber/wireplumber.conf.d/bluetooth-a2dp-autoconnect.conf.
# Approved after T14s reconnect selected HFP; microphone autoswitch remains enabled.
monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink a2dp_source ]
      }
    }
  }
]
