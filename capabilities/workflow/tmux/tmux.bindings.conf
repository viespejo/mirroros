# managed by MirrorOS configure
bind ^X lock-server
bind ^C new-window -c "$HOME"
bind ^W new-window -c "#{pane_current_path}"
bind w new-window -a -c "#{pane_current_path}"

bind ^D detach
bind * list-clients

bind h previous-window
bind l next-window

bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1

bind -r -T prefix H resize-pane -L 5
bind -r -T prefix J resize-pane -D 5
bind -r -T prefix K resize-pane -U 5
bind -r -T prefix L resize-pane -R 5

bind r command-prompt "rename-window %%"
bind ^A last-window
bind a send-prefix
bind z resize-pane -Z
bind ^Z resize-pane -Z
bind ^L send-keys "C-l"
bind | split-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '"' choose-window

bind : command-prompt
bind * setw synchronize-panes
bind P set pane-border-status
bind c kill-pane
bind x swap-pane -D
bind S choose-session
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -n S-Enter send-keys -H 1b 5b 31 33 3b 32 75 # Shift+Enter to send \e[13;2u

# Session selector candidate (Sesh); replaces Sessionx on Prefix+o
bind o run-shell "sesh connect \"$(sesh list --icons | fzf-tmux -p 80%,70% --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' --bind 'tab:down,btab:up' --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)')\""
