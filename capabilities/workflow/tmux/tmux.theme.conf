# managed by MirrorOS configure
# Tokyo Night (night) palette by Folke Lemaitre (MIT), from
# https://github.com/folke/tokyonight.nvim/blob/main/extras/tmux/tokyonight_night.tmux
# Status layout reproduces the module/window structure of the omerxx/catppuccin-tmux fork (MIT) it replaces.
set -g status on
set -g status-justify left
set -g status-style "bg=default"
set -g status 2
set -g status-format[1] "#[bg=default]"
set -g status-left-length 100
set -g status-right-length 100
set -g message-style "fg=#7dcfff,bg=#3b4261,align=centre"
set -g message-command-style "fg=#7dcfff,bg=#3b4261,align=centre"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g popup-style "bg=default,fg=default"
set -g popup-border-style "fg=#3b4261,bg=default"
# Native menus, chooser previews and pane overlays (Tmux 3.8).
set -g menu-style "fg=#c0caf5,bg=default"
set -g menu-selected-style "fg=#7dcfff,bg=#3b4261,bold"
set -g menu-border-style "fg=#3b4261,bg=default"
setw -g tree-mode-border-style "fg=#3b4261,bg=default"
setw -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#7dcfff,#7aa2f7},bg=default"
setw -g tree-mode-selection-style "fg=#7dcfff,bg=#3b4261,bold"
setw -g display-panes-colour "#7aa2f7"
setw -g display-panes-active-colour "#7dcfff"
setw -g display-panes-border-style "fg=#3b4261,bg=default"
setw -g pane-scrollbars-style "fg=#3b4261,bg=default,width=1,pad=0"
setw -g fill-character "#{?is_inside,#[bg=default] ,#[fg=#3b4261]#[acs]~}"
# Keep selections and search matches distinct without inherited grey fills.
setw -g copy-mode-match-style "fg=#7dcfff,bg=#3b4261"
setw -g copy-mode-current-match-style "fg=#16161e,bg=#e0af68"
setw -g copy-mode-mark-style "fg=#e0af68,bg=#3b4261"
setw -g copy-mode-line-number-style "fg=#565f89"
setw -g copy-mode-current-line-number-style "fg=#7dcfff,bold"
setw -g switch-mode-match-style "fg=#16161e,bg=#7dcfff"
setw -g window-status-activity-style "fg=#c0caf5,bg=default,none"
setw -g window-status-separator ""
setw -g window-status-style "fg=#c0caf5,bg=default,none"
setw -g clock-mode-colour "#7aa2f7"
setw -g mode-style "fg=#bb9af7 bg=#3b4261 bold"
setw -g window-status-format "#[fg=#3b4261,bg=default,nobold,nounderscore,noitalics]#[fg=#c0caf5,bg=#3b4261]#W#[fg=#7aa2f7,bg=#3b4261,nobold,nounderscore,noitalics] █#[fg=#3b4261,bg=#7aa2f7]#I#[fg=#7aa2f7,bg=default] "
setw -g window-status-current-format "#[bg=default,nobold,nounderscore,noitalics] #[fg=#c0caf5,bg=default]#W#{?window_zoomed_flag,(),}#[fg=#ff9e64,bg=default,nobold,nounderscore,noitalics] █#[fg=#16161e,bg=#ff9e64]#I#[fg=#ff9e64,bg=default] "
set -g status-left "#[fg=#{?client_prefix,#f7768e,#9ece6a},bg=default,nobold,nounderscore,noitalics]#[fg=#16161e,bg=#{?client_prefix,#f7768e,#9ece6a},nobold,nounderscore,noitalics] #[fg=#c0caf5,bg=#3b4261] #S#[fg=#3b4261,bg=default,nobold,nounderscore,noitalics] "
set -g status-right "#[fg=#bb9af7,bg=default,nobold,nounderscore,noitalics] #[fg=#16161e,bg=#bb9af7,nobold,nounderscore,noitalics] #[fg=#c0caf5,bg=#3b4261] #{b:pane_current_path}#[fg=#3b4261,bg=default,nobold,nounderscore,noitalics] #[fg=#7aa2f7,bg=default,nobold,nounderscore,noitalics] #[fg=#16161e,bg=#7aa2f7,nobold,nounderscore,noitalics]󰃰 #[fg=#c0caf5,bg=#3b4261] %H:%M#[fg=#3b4261,bg=default,nobold,nounderscore,noitalics]"
