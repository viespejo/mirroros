# MirrorOS memory reclaim policy (docs/adr/0007-zram-and-hibernation-policy.md).
# These are global settings, an initial baseline and not a claim of optimality.
# Administrators override them with a file under /etc/sysctl.d/.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_scale_factor = 125
vm.watermark_boost_factor = 0
